<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anatomy Practice Exam 2</title>
<style>
body{font-family:Arial;background:#f4f6f9;margin:0;color:#1f2937}header{background:#111827;color:white;padding:16px;position:sticky;top:0}
main{max-width:1050px;margin:22px auto;padding:0 15px;display:grid;grid-template-columns:1fr 250px;gap:18px}
.card{background:white;border:1px solid #d1d5db;border-radius:12px;padding:22px}.choice{border:1px solid #d1d5db;padding:12px;margin:9px 0;border-radius:9px;cursor:pointer}
.choice.sel{background:#dbeafe;border-color:#2563eb}button{padding:10px 14px;border:0;border-radius:8px;font-weight:bold;cursor:pointer}
.primary{background:#2563eb;color:white}.secondary{background:#e5e7eb}.flag{background:#fef3c7;color:#92400e}
.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.nav button{padding:7px}.answered{background:#bfdbfe}.current{outline:2px solid #2563eb}
.flagged{box-shadow:inset 0 -4px 0 #f59e0b}.hidden{display:none}.correct{border-left:6px solid #16a34a}.incorrect{border-left:6px solid #dc2626}
.review{margin:14px 0}@media(max-width:760px){main{grid-template-columns:1fr}aside{order:-1}}
</style></head>
<body><header><b>Anatomy Practice Exam 2 — Harder Questions</b> <span style="float:right" id="timer">00:00:00</span></header>
<main id="exam"><section class="card"><div id="count"></div><h3 id="q"></h3><div id="choices"></div>
<div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:18px"><button class="secondary" id="prev">Previous</button><button class="flag" id="flag">Flag</button><button class="primary" id="next">Next</button></div></section>
<aside class="card"><b>Questions</b><div class="nav" id="nav" style="margin-top:12px"></div><p id="progress"></p><button class="primary" style="width:100%" id="submit">Submit exam</button></aside></main>
<section id="results" class="hidden" style="max-width:950px;margin:20px auto;padding:0 15px"><div class="card"><h2>Results</h2><h1 id="score"></h1><div id="breakdown"></div></div><div id="review"></div></section>
<script>
const qs=[{"topic": "Procedures", "q": "A 24-year-old patient undergoes lumbar puncture at the L4\u2013L5 interspace. After the needle passes through the ligamentum flavum, the clinician advances through one potential space and then punctures two meningeal layers before obtaining CSF. Which structure is encountered immediately after the ligamentum flavum?", "choices": ["Dura mater", "Arachnoid mater", "Epidural space", "Subarachnoid space", "Posterior longitudinal ligament"], "answer": 2, "explanation": "The epidural space lies immediately deep to the ligamentum flavum. The needle then pierces dura and arachnoid before entering the subarachnoid space."}, {"topic": "Procedures", "q": "An anesthesiologist inserts a needle in the midline at L3\u2013L4 and intentionally stops after feeling the characteristic loss of resistance associated with penetration of the ligamentum flavum. Which structure should remain intact if the procedure is performed correctly?", "choices": ["Supraspinous ligament", "Interspinous ligament", "Ligamentum flavum", "Dura mater", "Skin"], "answer": 3, "explanation": "This describes epidural anesthesia. The dura should remain intact."}, {"topic": "Procedures", "q": "A student is asked to identify the final tissue layer pierced during a lumbar puncture before CSF flows into the needle hub. Which layer is correct?", "choices": ["Dura mater", "Arachnoid mater", "Pia mater", "Ligamentum flavum", "Posterior longitudinal ligament"], "answer": 1, "explanation": "The arachnoid mater is the final layer punctured before entering the CSF-filled subarachnoid space."}, {"topic": "Procedures", "q": "A physician palpates the highest points of both iliac crests before performing a lumbar puncture. The line connecting these landmarks most closely crosses which level, and which interspace may safely be used immediately inferior to it?", "choices": ["L2; L2\u2013L3", "L3; L3\u2013L4", "L4; L4\u2013L5", "L5; L5\u2013S1", "S1; S1\u2013S2"], "answer": 2, "explanation": "The intercristal line identifies L4 or the L4\u2013L5 interspace."}, {"topic": "Procedures", "q": "A lumbar puncture is attempted in an adult at the L1\u2013L2 interspace. Which structure is at greatest risk compared with a properly placed L4\u2013L5 puncture?", "choices": ["Cauda equina", "Dural sac", "Spinal cord", "Filum terminale", "Posterior longitudinal ligament"], "answer": 2, "explanation": "The adult spinal cord ends near the superior border of L2, so a high puncture risks direct cord injury."}, {"topic": "Procedures", "q": "A patient requires access to the cisterna magna. Which membrane must the needle pierce after passing through the posterior neck tissues?", "choices": ["Anterior atlanto-occipital membrane", "Posterior atlanto-occipital membrane", "Tectorial membrane", "Transverse ligament of the atlas", "Ligamentum nuchae only"], "answer": 1, "explanation": "Cisternal puncture requires penetration of the posterior atlanto-occipital membrane."}, {"topic": "Radiculopathy", "q": "A 52-year-old patient has a posterolateral L4\u2013L5 disc herniation. He has weakness of great-toe extension but retains a normal Achilles reflex. Which additional finding is most likely?", "choices": ["Loss of sensation over the medial malleolus", "Difficulty walking on the heels", "Loss of the patellar reflex", "Weakness of toe walking", "Sensory loss over the lateral foot"], "answer": 1, "explanation": "L5 radiculopathy causes weakness of dorsiflexion and heel walking. Achilles and toe walking are mainly S1."}, {"topic": "Radiculopathy", "q": "MRI shows a far-lateral L4\u2013L5 disc herniation. Which combination of findings is most likely?", "choices": ["Weak great-toe extension with dorsal-foot numbness", "Weak plantarflexion with lateral-foot numbness", "Weak quadriceps with medial-leg numbness", "Weak hip abduction with posterior-thigh numbness", "Weak hamstrings with saddle anesthesia"], "answer": 2, "explanation": "A far-lateral L4\u2013L5 herniation affects the exiting L4 root: quadriceps weakness, reduced patellar reflex, and medial-leg sensory change."}, {"topic": "Radiculopathy", "q": "A patient has numbness of the middle finger, weakness of finger extension, and a reduced triceps reflex. Which disc level is the most likely source of a posterolateral herniation?", "choices": ["C4\u2013C5", "C5\u2013C6", "C6\u2013C7", "C7\u2013T1", "T1\u2013T2"], "answer": 2, "explanation": "The findings localize to C7, commonly compressed by a C6\u2013C7 herniation."}, {"topic": "Radiculopathy", "q": "A patient has weakness involving muscles supplied by several distal nerves, diminished reflexes, and sensory symptoms restricted to a dermatome. Which lesion best explains this pattern?", "choices": ["Single distal neuropathy", "Neuromuscular junction disorder", "Radiculopathy", "Primary myopathy", "Cerebellar lesion"], "answer": 2, "explanation": "A root lesion affects a myotome across multiple named peripheral nerves and produces dermatomal sensory findings."}, {"topic": "Radiculopathy", "q": "A patient with an L5 radiculopathy is tested at the bedside. Which muscle is most useful for confirming the suspected root level?", "choices": ["Quadriceps femoris", "Tibialis anterior only", "Extensor hallucis longus", "Fibularis longus", "Gastrocnemius"], "answer": 2, "explanation": "Extensor hallucis longus is a key L5 muscle."}, {"topic": "Radiculopathy", "q": "A patient with suspected S1 radiculopathy can dorsiflex the ankle normally but cannot stand on tiptoes. Which reflex abnormality is most likely?", "choices": ["Absent patellar reflex", "Reduced Achilles reflex", "Reduced biceps reflex", "Reduced triceps reflex", "No reflex change is expected"], "answer": 1, "explanation": "S1 contributes to plantarflexion/toe walking and the Achilles reflex."}, {"topic": "Trauma", "q": "A diver strikes the top of his head on the bottom of a pool. CT shows fractures of the anterior and posterior arches of C1 with lateral displacement of the fragments. Which additional statement is most accurate?", "choices": ["This is a hangman fracture caused by hyperextension", "The spinal cord is usually spared because the ring expands outward", "The dens is always avascular afterward", "The injury is caused by forced rotation", "The transverse ligament must remain intact"], "answer": 1, "explanation": "A Jefferson burst fracture results from axial loading and often expands outward, so the cord may be spared."}, {"topic": "Trauma", "q": "A motor-vehicle collision produces bilateral fractures through the pars interarticularis of C2. Which mechanism most likely produced this injury?", "choices": ["Axial compression", "Hyperflexion", "Hyperextension", "Contralateral rotation", "Direct blow to T1"], "answer": 2, "explanation": "A hangman fracture classically results from traumatic hyperextension."}, {"topic": "Trauma", "q": "A patient with rheumatoid arthritis undergoes forceful high-velocity cervical manipulation and develops craniocervical instability. Which ligament was most likely injured, and what movement normally stresses it?", "choices": ["Transverse ligament; flexion", "Alar ligament; contralateral rotation", "Anterior longitudinal ligament; rotation", "Ligamentum flavum; extension", "Posterior longitudinal ligament; lateral flexion"], "answer": 1, "explanation": "Alar ligaments limit rotation and are vulnerable in inflammatory disease."}, {"topic": "Trauma", "q": "Following rupture of the transverse ligament of the atlas, which structure can move posteriorly and compress the spinal cord?", "choices": ["Posterior arch of C1", "Dens of C2", "Occipital condyle", "Spinous process of C2", "Vertebral artery"], "answer": 1, "explanation": "The transverse ligament restrains the dens against the anterior arch of C1."}, {"topic": "Clinical back", "q": "A 70-year-old patient has progressive thoracic kyphosis, loss of lumbar lordosis, reduced height, and vertebral compression fractures. Which additional finding is most likely?", "choices": ["Increased bone density", "Deep back muscle dysfunction and axial pain", "Preserved vertebral body height", "Bamboo spine", "Congenital hemivertebra"], "answer": 1, "explanation": "Osteoporosis causes vertebral compression fractures, pain, and deep-back muscle dysfunction."}, {"topic": "Clinical back", "q": "A patient with chronic sacroiliac and lumbar pain has markedly reduced spinal mobility and radiographic 'bamboo spine.' Which tissue has undergone pathologic ossification?", "choices": ["Nucleus pulposus", "Annulus fibrosus", "Dura mater", "Pia mater", "Posterior root ganglion"], "answer": 1, "explanation": "Ankylosing spondylitis produces ossification of the annulus fibrosus and related spinal ligaments."}, {"topic": "Clinical back", "q": "A man with prostate cancer develops lumbar vertebral metastases before any lung metastases are detected. Which feature of the responsible venous network best explains this pattern?", "choices": ["It contains numerous valves", "It drains only into the portal vein", "It communicates with pelvic veins through valveless channels", "It is separated from vertebral bodies by dura", "It carries arterial blood"], "answer": 2, "explanation": "Batson's plexus is valveless and communicates with pelvic veins, allowing retrograde tumor spread."}, {"topic": "Clinical back", "q": "A patient experiences dizziness and near-syncope only when maintaining the head in extreme rotation. Which structure is most likely compressed?", "choices": ["Internal carotid artery", "Vertebral artery", "External jugular vein", "Anterior spinal artery", "Middle meningeal artery"], "answer": 1, "explanation": "Bow Hunter syndrome involves positional vertebral artery compression."}, {"topic": "Clinical back", "q": "A central lumbar disc herniation compresses multiple roots below the conus medullaris. Which finding would be most concerning for cauda equina syndrome?", "choices": ["Unilateral C6 numbness", "Saddle anesthesia with urinary retention", "Isolated wrist-drop", "Hyperactive biceps reflex", "Loss of facial sensation"], "answer": 1, "explanation": "Cauda equina syndrome causes saddle anesthesia, multiroot weakness, and bowel/bladder dysfunction."}, {"topic": "Surface anatomy", "q": "A physician uses the inferior angle of the scapula as a posterior thoracic landmark. Which spinous process is most closely aligned with it in the anatomic position?", "choices": ["T4", "T5", "T6", "T7", "T9"], "answer": 3, "explanation": "The inferior angle of the scapula is approximately level with T7."}, {"topic": "Surface anatomy", "q": "A palpable midline prominence at the base of the neck is used to orient a cervical examination. Which vertebra is usually being palpated?", "choices": ["C2", "C4", "C5", "C7", "T2"], "answer": 3, "explanation": "C7 is the vertebra prominens."}, {"topic": "Deep back", "q": "A patient develops burning pain over the posterior scalp after severe spasm of semispinalis capitis. Which nerve is most likely compressed?", "choices": ["Suboccipital nerve", "Greater occipital nerve", "Lesser occipital nerve", "Great auricular nerve", "Spinal accessory nerve"], "answer": 1, "explanation": "The greater occipital nerve (posterior ramus of C2) passes through semispinalis capitis."}, {"topic": "Deep back", "q": "A lesion selectively damages posterior rami in the lumbar region. Which deficit is most likely?", "choices": ["Loss of quadriceps strength only", "Weakness of intrinsic lumbar back muscles", "Loss of all lower-limb sensation", "Paralysis of the diaphragm", "Loss of trapezius function"], "answer": 1, "explanation": "Intrinsic deep-back muscles receive segmental innervation from posterior rami."}, {"topic": "Superficial back", "q": "A patient has shoulder droop and difficulty abducting the arm above 90 degrees after surgery in the posterior triangle. Which nerve was most likely injured?", "choices": ["Dorsal scapular nerve", "Thoracodorsal nerve", "Long thoracic nerve", "Spinal accessory nerve", "Suprascapular nerve"], "answer": 3, "explanation": "The spinal accessory nerve supplies trapezius, which is required for upward rotation of the scapula."}, {"topic": "Articulations", "q": "A patient can flex and extend the head in a 'yes' motion but has severe pain with rotation in a 'no' motion. Which articulation is most directly responsible for the impaired motion?", "choices": ["Atlanto-occipital joint", "Median atlanto-axial joint", "C3\u2013C4 intervertebral disc", "C7\u2013T1 zygapophyseal joint", "Temporomandibular joint"], "answer": 1, "explanation": "Rotation occurs primarily at the atlanto-axial articulation, especially the median pivot joint."}, {"topic": "Articulations", "q": "Osteoarthritis affects a joint between the inferior articular process of one vertebra and the superior articular process of the vertebra below. How is this joint classified?", "choices": ["Primary cartilaginous", "Secondary cartilaginous", "Synovial plane", "Synovial pivot", "Fibrous syndesmosis"], "answer": 2, "explanation": "Zygapophyseal joints are plane synovial joints."}, {"topic": "Embryology", "q": "A placenta implants over the internal cervical os, causing painless third-trimester bleeding. Which diagnosis is most likely?", "choices": ["Placenta accreta", "Placenta increta", "Placenta percreta", "Placenta previa", "Placental abruption"], "answer": 3, "explanation": "Placenta previa overlies or approaches the internal cervical os."}, {"topic": "Embryology", "q": "A placenta is abnormally adherent to the uterine wall because chorionic villi attach directly to the myometrium without normal decidual separation but do not invade deeply into the muscle. Which diagnosis is most likely?", "choices": ["Placenta previa", "Placenta accreta", "Placenta increta", "Placenta percreta", "Hydatidiform mole"], "answer": 1, "explanation": "Placenta accreta is abnormal adherence to the myometrium; increta invades it and percreta penetrates through it."}];let i=0,ans=Array(qs.length).fill(null),flags=Array(qs.length).fill(false),start=Date.now();
setInterval(()=>{let s=Math.floor((Date.now()-start)/1000);timer.textContent=`${String(Math.floor(s/3600)).padStart(2,'0')}:${String(Math.floor((s%3600)/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`},1000);
const L=n=>String.fromCharCode(65+n);
function draw(){count.textContent=`Question ${i+1} of ${qs.length} — ${qs[i].topic}`;q.textContent=qs[i].q;choices.innerHTML='';
qs[i].choices.forEach((c,j)=>{let d=document.createElement('div');d.className='choice'+(ans[i]===j?' sel':'');d.innerHTML=`<b>${L(j)}.</b> ${c}`;d.onclick=()=>{ans[i]=j;draw()};choices.appendChild(d)});
prev.disabled=i===0;next.textContent=i===qs.length-1?'Review':'Next';flag.textContent=flags[i]?'Unflag':'Flag';drawNav()}
function drawNav(){nav.innerHTML='';qs.forEach((_,j)=>{let b=document.createElement('button');b.textContent=j+1;if(ans[j]!=null)b.classList.add('answered');if(j===i)b.classList.add('current');if(flags[j])b.classList.add('flagged');b.onclick=()=>{i=j;draw()};nav.appendChild(b)});let d=ans.filter(x=>x!=null).length;progress.textContent=`${d} answered, ${qs.length-d} unanswered`}
prev.onclick=()=>{if(i>0){i--;draw()}};next.onclick=()=>{if(i<qs.length-1){i++;draw()}};flag.onclick=()=>{flags[i]=!flags[i];draw()};
submit.onclick=()=>{let u=ans.filter(x=>x==null).length;if(u&&!confirm(`Submit with ${u} unanswered?`))return;if(confirm('Submit exam?'))grade()};
function grade(){exam.classList.add('hidden');results.classList.remove('hidden');let c=qs.reduce((n,x,j)=>n+(ans[j]===x.answer),0);score.textContent=`${c} / ${qs.length} (${Math.round(c/qs.length*100)}%)`;
let topics={};qs.forEach((x,j)=>{topics[x.topic]??={r:0,t:0};topics[x.topic].t++;if(ans[j]===x.answer)topics[x.topic].r++});breakdown.innerHTML=Object.entries(topics).map(([k,v])=>`<div>${k}: <b>${v.r}/${v.t}</b></div>`).join('');
review.innerHTML='';qs.forEach((x,j)=>{let d=document.createElement('div');d.className='card review '+(ans[j]===x.answer?'correct':'incorrect');d.innerHTML=`<b>Question ${j+1}</b><p>${x.q}</p><p>Your answer: ${ans[j]==null?'None':L(ans[j])}<br>Correct answer: ${L(x.answer)}</p><p><b>Explanation:</b> ${x.explanation}</p>`;review.appendChild(d)});scrollTo(0,0)}draw();
</script></body></html>
