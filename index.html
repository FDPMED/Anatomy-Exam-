<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Embryology Practice Exam 1</title><style>
body{font-family:Arial,sans-serif;background:#f4f6f9;margin:0;color:#1f2937}header{background:#111827;color:#fff;padding:16px;position:sticky;top:0;z-index:3}main{max-width:1100px;margin:22px auto;padding:0 14px;display:grid;grid-template-columns:1fr 260px;gap:18px}.card{background:#fff;border:1px solid #d1d5db;border-radius:12px;padding:22px;box-shadow:0 2px 8px #0000000d}.choice{border:1px solid #d1d5db;padding:12px;margin:9px 0;border-radius:9px;cursor:pointer}.choice:hover{background:#f9fafb}.choice.sel{background:#dbeafe;border-color:#2563eb}button{padding:10px 14px;border:0;border-radius:8px;font-weight:bold;cursor:pointer}.primary{background:#2563eb;color:white}.secondary{background:#e5e7eb}.flag{background:#fef3c7;color:#92400e}.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.nav button{padding:7px}.answered{background:#bfdbfe}.current{outline:2px solid #2563eb}.flagged{box-shadow:inset 0 -4px 0 #f59e0b}.hidden{display:none}.correct{border-left:6px solid #16a34a}.incorrect{border-left:6px solid #dc2626}.review{margin:14px 0}@media(max-width:760px){main{grid-template-columns:1fr}aside{order:-1}}</style></head><body>
<header><b>Embryology Practice Exam 1 — Lectures 1–4</b><span style="float:right" id="timer">00:00:00</span></header><main id="exam"><section class="card"><div id="count"></div><h3 id="q"></h3><div id="choices"></div><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:18px"><button class="secondary" id="prev">Previous</button><button class="flag" id="flag">Flag</button><button class="primary" id="next">Next</button></div></section><aside class="card"><b>Question Navigator</b><div class="nav" id="nav" style="margin-top:12px"></div><p id="progress"></p><button class="primary" style="width:100%" id="submit">Submit exam</button></aside></main><section id="results" class="hidden" style="max-width:950px;margin:20px auto;padding:0 15px"><div class="card"><h2>Results</h2><h1 id="score"></h1><div id="breakdown"></div></div><div id="review"></div></section>
<script>const qs=[{"topic": "Developmental periods", "q": "A pregnant patient is exposed to a teratogen during gestational week 6. Which consequence is most likely compared with exposure during week 14?", "choices": ["Isolated growth restriction without structural defects", "A major structural malformation during organogenesis", "No effect because implantation is complete", "Only functional impairment of the central nervous system", "Only placental insufficiency"], "answer": 1, "explanation": "Weeks 3\u20138 comprise the embryonic period, when organogenesis occurs and major structural malformations are most likely."}, {"topic": "Developmental periods", "q": "A 10-week pregnant patient inhales a potentially teratogenic solvent. Which structures remain especially vulnerable during the fetal period?", "choices": ["Heart and kidneys only", "Brain, eyes, ears, palate, teeth, and external genitalia", "Limbs and somites only", "Notochord and primitive streak", "Chorionic villi only"], "answer": 1, "explanation": "During the fetal period, the brain, eyes, ears, palate, teeth, and external genitalia remain especially vulnerable."}, {"topic": "Congenital anomalies", "q": "A fetus develops clubfeet because of prolonged mechanical compression in utero. Which category best describes this abnormality?", "choices": ["Malformation", "Disruption", "Deformation", "Dysplasia", "Agenesis"], "answer": 2, "explanation": "A deformation results from mechanical forces acting on an otherwise normally formed structure."}, {"topic": "Congenital anomalies", "q": "An amniotic band constricts a fully formed fetal limb, causing distal tissue loss. Which term best classifies the defect?", "choices": ["Malformation", "Disruption", "Deformation", "Dysplasia", "Hypoplasia"], "answer": 1, "explanation": "A disruption is produced by an external influence that damages a previously normal structure."}, {"topic": "Congenital anomalies", "q": "A newborn has abnormal organization of cells within a tissue despite the presence of the tissue itself. Which category applies?", "choices": ["Dysplasia", "Aplasia", "Agenesis", "Atresia", "Association"], "answer": 0, "explanation": "Dysplasia is abnormal organization of cells into tissue."}, {"topic": "Cell cycle and meiosis", "q": "A germ cell undergoes crossing over between homologous chromosomes. During which meiotic stage does this occur?", "choices": ["Prophase I, pachytene", "Metaphase I", "Anaphase I", "Prophase II", "Metaphase II"], "answer": 0, "explanation": "Crossing over occurs during pachytene of prophase I."}, {"topic": "Cell cycle and meiosis", "q": "A cell contains both maternal and paternal homologs, each composed of two sister chromatids. Which description is most accurate?", "choices": ["Haploid, 1N", "Haploid, 2N", "Diploid, 2N", "Diploid, 4N", "Tetraploid, 8N"], "answer": 3, "explanation": "After DNA replication but before division, the cell remains diploid but contains 4N DNA."}, {"topic": "Cell cycle and meiosis", "q": "Which feature most directly explains why the products of meiosis are genetically different from the parent cell?", "choices": ["DNA replication in S phase only", "Crossing over and random alignment of homologs", "Cytokinesis after meiosis II", "Formation of spindle fibers", "Loss of the nuclear envelope"], "answer": 1, "explanation": "Crossing over and independent assortment generate genetic diversity."}, {"topic": "Gametogenesis", "q": "Primordial germ cells are first derived from which embryonic tissue before migrating to the yolk sac?", "choices": ["Hypoblast", "Epiblast", "Trophoblast", "Extraembryonic mesoderm", "Neural crest"], "answer": 1, "explanation": "Primordial germ cells originate in the epiblast and temporarily migrate to the yolk sac."}, {"topic": "Gametogenesis", "q": "A mutation prevents primordial germ cells from reaching the posterior abdominal wall during weeks 4\u20136. Which structure would fail to develop normally?", "choices": ["Primitive sex cords and genital ridges", "Neural tube", "Somites", "Chorionic villi", "Amnion"], "answer": 0, "explanation": "Migrating primordial germ cells induce primitive sex cords and contribute to genital ridge development."}, {"topic": "Male gametogenesis", "q": "A seminiferous tubule contains a germ cell that is about to undergo meiosis I. Which cell is it?", "choices": ["Type A spermatogonium", "Type B spermatogonium", "Primary spermatocyte", "Secondary spermatocyte", "Spermatid"], "answer": 2, "explanation": "Primary spermatocytes undergo meiosis I to form secondary spermatocytes."}, {"topic": "Male gametogenesis", "q": "A sperm sample shows abundant residual cytoplasm, an uncondensed nucleus, and poorly formed tails. Which process is defective?", "choices": ["Spermatogonial mitosis", "Meiosis I", "Meiosis II", "Spermiogenesis", "Capacitation"], "answer": 3, "explanation": "Spermiogenesis includes nuclear condensation, cytoplasmic loss, tail formation, and acrosome formation."}, {"topic": "Male gametogenesis", "q": "A spermatozoon is structurally normal but cannot bind and penetrate the oocyte after ejaculation. Which maturation step most likely failed?", "choices": ["Meiosis I", "Meiosis II", "Spermiogenesis", "Capacitation", "Cleavage"], "answer": 3, "explanation": "Capacitation occurs in the female reproductive tract and permits successful interaction with the oocyte."}, {"topic": "Male gametogenesis", "q": "Which cell most directly gives rise to primary spermatocytes?", "choices": ["Type A dark spermatogonia", "Type A pale spermatogonia", "Type B spermatogonia", "Secondary spermatocytes", "Spermatids"], "answer": 2, "explanation": "Type B spermatogonia differentiate into primary spermatocytes."}, {"topic": "Female gametogenesis", "q": "A primary oocyte has remained dormant since fetal life. At what point does it complete meiosis I?", "choices": ["At birth", "At puberty", "Just before ovulation", "Immediately after implantation", "Only after fertilization"], "answer": 2, "explanation": "The primary oocyte completes meiosis I just before ovulation."}, {"topic": "Female gametogenesis", "q": "An ovulated oocyte is arrested at which stage until fertilization occurs?", "choices": ["Prophase I", "Metaphase I", "Anaphase I", "Metaphase II", "Telophase II"], "answer": 3, "explanation": "The secondary oocyte is arrested in metaphase II until fertilization."}, {"topic": "Female gametogenesis", "q": "A follicle is composed of a primary oocyte surrounded by a single layer of squamous follicular cells. Which follicle is present?", "choices": ["Primordial follicle", "Unilaminar primary follicle", "Multilaminar primary follicle", "Vesicular follicle", "Graafian follicle"], "answer": 0, "explanation": "A primordial follicle has a primary oocyte with one squamous follicular layer."}, {"topic": "Female gametogenesis", "q": "A follicle contains a primary oocyte, a zona pellucida, and a single layer of cuboidal follicular cells. Which stage is this?", "choices": ["Primordial follicle", "Unilaminar primary follicle", "Multilaminar primary follicle", "Vesicular follicle", "Corpus luteum"], "answer": 1, "explanation": "The unilaminar primary follicle is the first stage with cuboidal follicular cells and a zona pellucida."}, {"topic": "Female gametogenesis", "q": "A large ovarian follicle contains a fluid-filled antrum and a cumulus oophorus. Which structure is most likely?", "choices": ["Primordial follicle", "Primary follicle", "Vesicular/Graafian follicle", "Corpus albicans", "Atretic germ cell"], "answer": 2, "explanation": "An antrum and cumulus oophorus identify a vesicular, especially Graafian, follicle."}, {"topic": "Female gametogenesis", "q": "A biopsy identifies steroid-secreting cells immediately external to the granulosa layer. Which structure is being observed?", "choices": ["Theca interna", "Theca externa", "Zona pellucida", "Corona radiata", "Cumulus oophorus"], "answer": 0, "explanation": "The theca interna differentiates into steroid-secreting cells."}, {"topic": "Ovarian cycle", "q": "A surge of which hormones directly triggers resumption of meiosis and ovulation?", "choices": ["Estrogen and progesterone", "FSH and LH", "hCG and progesterone", "GnRH and hCG", "Prolactin and oxytocin"], "answer": 1, "explanation": "The midcycle FSH/LH surge triggers meiosis resumption and ovulation."}, {"topic": "Ovarian cycle", "q": "A patient does not become pregnant after ovulation. Which event initiates the ischemic phase of the uterine cycle?", "choices": ["Rising estrogen", "Rising hCG", "Declining progesterone", "LH surge", "FSH surge"], "answer": 2, "explanation": "Loss of corpus luteum function lowers progesterone and causes spiral artery constriction."}, {"topic": "Ovarian cycle", "q": "After implantation, which embryonic tissue prevents degeneration of the corpus luteum?", "choices": ["Epiblast", "Hypoblast", "Cytotrophoblast", "Syncytiotrophoblast", "Extraembryonic mesoderm"], "answer": 3, "explanation": "The syncytiotrophoblast secretes hCG, maintaining the corpus luteum."}, {"topic": "Fertilization", "q": "A sperm reaches the ampulla but cannot traverse the corona radiata. Which event most likely failed?", "choices": ["Zona reaction", "Cortical reaction", "Acrosome reaction", "Cleavage", "Compaction"], "answer": 2, "explanation": "Acrosomal enzymes aid dispersal of the corona radiata and penetration of the zona pellucida."}, {"topic": "Fertilization", "q": "Fusion of sperm and oocyte membranes triggers release of lysosomal granules from the oocyte. What is the principal consequence?", "choices": ["Completion of meiosis I", "Prevention of polyspermy", "Formation of the male pronucleus", "Initiation of implantation", "Loss of the zona pellucida"], "answer": 1, "explanation": "The cortical and zona reactions prevent additional sperm entry."}, {"topic": "Fertilization", "q": "Which event occurs immediately after sperm-oocyte membrane fusion?", "choices": ["Implantation", "Completion of oocyte meiosis II", "Compaction", "Formation of the blastocyst cavity", "Formation of primary villi"], "answer": 1, "explanation": "Fusion stimulates the secondary oocyte to complete meiosis II."}, {"topic": "Fertilization", "q": "A zygote contains one maternal and one paternal pronucleus. Which outcome has already been established?", "choices": ["Implantation site", "Genetic sex", "Formation of the amnion", "Placental circulation", "Germ-layer identity"], "answer": 1, "explanation": "Fertilization restores diploidy and determines genetic sex."}, {"topic": "First week", "q": "A conceptus undergoes rapid mitotic divisions while remaining the same overall size. What is this process called?", "choices": ["Gastrulation", "Cleavage", "Neurulation", "Implantation", "Compaction only"], "answer": 1, "explanation": "Cleavage produces progressively smaller blastomeres without overall growth."}, {"topic": "First week", "q": "A compact ball of blastomeres is recovered from the uterine tube approximately 3 days after fertilization. Which stage is most likely?", "choices": ["Zygote", "Morula", "Blastocyst", "Bilaminar disc", "Gastrula"], "answer": 1, "explanation": "The morula forms around day 3."}, {"topic": "First week", "q": "A blastocyst contains an inner cell mass at one pole and an outer epithelial layer. Which structures do these become?", "choices": ["Embryoblast and trophoblast", "Epiblast and hypoblast", "Cytotrophoblast and syncytiotrophoblast", "Amnion and yolk sac", "Somatic and splanchnic mesoderm"], "answer": 0, "explanation": "The inner cell mass becomes the embryoblast; the outer cell mass becomes the trophoblast."}, {"topic": "Implantation", "q": "A patient has amenorrhea, abdominal pain, vaginal bleeding, elevated hCG, and a tubal mass. Which diagnosis is most likely?", "choices": ["Placenta previa", "Placental abruption", "Ectopic pregnancy", "Hydatidiform mole", "Placenta accreta"], "answer": 2, "explanation": "The triad with a tubal mass indicates ectopic implantation."}, {"topic": "Implantation", "q": "Ultrasound reveals implantation in the uterine cervix. Which diagnosis is most accurate?", "choices": ["Placenta previa", "Placenta accreta", "Placenta increta", "Placenta percreta", "Placental abruption"], "answer": 0, "explanation": "Placenta previa involves implantation over or near the internal cervical os."}, {"topic": "Implantation", "q": "A placenta is abnormally adherent to the myometrium but does not invade it. Which diagnosis applies?", "choices": ["Placenta previa", "Placenta accreta", "Placenta increta", "Placenta percreta", "Placental abruption"], "answer": 1, "explanation": "Accreta adheres to myometrium; increta invades it; percreta penetrates through it."}, {"topic": "Second week", "q": "By day 8, the embryoblast has differentiated into which two layers?", "choices": ["Cytotrophoblast and syncytiotrophoblast", "Epiblast and hypoblast", "Somatic and splanchnic mesoderm", "Ectoderm and endoderm", "Amnion and chorion"], "answer": 1, "explanation": "The bilaminar embryonic disc consists of epiblast and hypoblast."}, {"topic": "Second week", "q": "A cavity develops above the epiblast during the second week. Which cavity is it?", "choices": ["Primary yolk sac", "Chorionic cavity", "Amniotic cavity", "Blastocyst cavity", "Intraembryonic coelom"], "answer": 2, "explanation": "The amniotic cavity forms adjacent to the epiblast."}, {"topic": "Second week", "q": "Hypoblast cells spread along the inner surface of the cytotrophoblast. What is the resulting lining called?", "choices": ["Chorion", "Heuser membrane", "Amnion", "Decidua basalis", "Somatopleure"], "answer": 1, "explanation": "Hypoblast-derived extraembryonic endoderm forms Heuser membrane around the primary yolk sac."}, {"topic": "Second week", "q": "Extraembryonic mesoderm splits into somatic and splanchnic layers. Which cavity forms between them?", "choices": ["Amniotic cavity", "Primary yolk sac", "Chorionic cavity", "Blastocyst cavity", "Neural canal"], "answer": 2, "explanation": "Splitting of extraembryonic mesoderm creates the chorionic cavity."}, {"topic": "Second week", "q": "Which structure connects the embryo to the trophoblastic shell before formation of the umbilical cord?", "choices": ["Primitive streak", "Connecting stalk", "Allantois", "Notochord", "Chorionic plate"], "answer": 1, "explanation": "The connecting stalk is the precursor to the umbilical cord."}, {"topic": "Trophoblast", "q": "Which trophoblastic layer is mitotically active and supplies new cells to the outer layer?", "choices": ["Syncytiotrophoblast", "Cytotrophoblast", "Hypoblast", "Epiblast", "Extraembryonic endoderm"], "answer": 1, "explanation": "Cytotrophoblast cells proliferate and contribute cells to the syncytiotrophoblast."}, {"topic": "Trophoblast", "q": "Which trophoblastic layer secretes hCG?", "choices": ["Cytotrophoblast", "Syncytiotrophoblast", "Hypoblast", "Extraembryonic mesoderm", "Epiblast"], "answer": 1, "explanation": "The syncytiotrophoblast secretes hCG."}, {"topic": "hCG", "q": "Serial beta-hCG values rise much more slowly than expected and then plateau. Which interpretation is most appropriate?", "choices": ["Normal viable pregnancy", "Decreased placental viability", "Twin pregnancy", "Complete mole", "Normal luteal phase"], "answer": 1, "explanation": "Slow-rising, plateauing, or declining hCG suggests impaired pregnancy viability."}, {"topic": "hCG", "q": "A patient at 8 weeks has severe hyperemesis, a uterus large for dates, vaginal bleeding, and beta-hCG far above the expected range. Which diagnosis is most likely?", "choices": ["Ectopic pregnancy", "Placenta previa", "Hydatidiform mole", "Placental abruption", "Oligohydramnios"], "answer": 2, "explanation": "Markedly elevated hCG plus a large-for-dates uterus and bleeding suggests molar pregnancy."}, {"topic": "Placental villi", "q": "A primary chorionic villus becomes a secondary villus when which tissue enters its core?", "choices": ["Embryoblast", "Extraembryonic mesoderm", "Maternal blood", "Fetal blood vessels", "Syncytiotrophoblast"], "answer": 1, "explanation": "Secondary villi form when extraembryonic mesoderm extends into primary villi."}, {"topic": "Placental villi", "q": "A chorionic villus contains fetal blood vessels that connect to the developing embryonic circulation. Which stage is present?", "choices": ["Primary villus", "Secondary villus", "Tertiary villus", "Hydropic villus", "Anchoring villus only"], "answer": 2, "explanation": "Tertiary villi contain fetal capillaries."}, {"topic": "Placental exchange", "q": "During early placental exchange, maternal and fetal blood normally remain separated. Which structure is part of the barrier?", "choices": ["Syncytiotrophoblast", "Maternal endothelium only", "Decidua capsularis only", "Amniotic epithelium only", "Neural crest"], "answer": 0, "explanation": "The early placental barrier includes syncytiotrophoblast, cytotrophoblast, villous connective tissue, and fetal capillary endothelium."}, {"topic": "Molar pregnancy", "q": "A conceptus forms placental membranes and hydropic villi but no embryo. Which tissue has proliferated abnormally?", "choices": ["Epiblast", "Hypoblast", "Trophoblast", "Intermediate mesoderm", "Neural crest"], "answer": 2, "explanation": "Complete moles consist of trophoblastic proliferation without an embryoblast."}, {"topic": "Molar pregnancy", "q": "A molar pregnancy contains a poorly developed embryo and is triploid. Which type is most likely?", "choices": ["Complete mole", "Partial mole", "Placenta accreta", "Placenta previa", "Choriocarcinoma"], "answer": 1, "explanation": "Partial moles contain a poorly developed embryo and are triploid."}, {"topic": "Molar pregnancy", "q": "A patient passes grape-like vesicles and ultrasound shows a snowstorm pattern. What do the vesicles represent?", "choices": ["Necrotic decidua", "Hydropic chorionic villi", "Amniotic bands", "Enlarged yolk sacs", "Fetal membranes filled with blood"], "answer": 1, "explanation": "The grape-like vesicles are edematous, hydropic chorionic villi."}, {"topic": "Molar pregnancy", "q": "Which malignant complication must be monitored for after evacuation of a hydatidiform mole?", "choices": ["Endometrial carcinoma", "Choriocarcinoma", "Cervical carcinoma", "Ovarian teratoma", "Leiomyosarcoma"], "answer": 1, "explanation": "A subset of moles progress to gestational trophoblastic neoplasia, including choriocarcinoma."}, {"topic": "Amniotic fluid", "q": "A fetus has severe renal agenesis and produces very little urine. Which amniotic-fluid abnormality is most likely?", "choices": ["Polyhydramnios", "Oligohydramnios", "Hydatidiform mole", "Placenta previa", "Chorioamnionitis only"], "answer": 1, "explanation": "Reduced fetal urine production commonly causes oligohydramnios."}];let i=0,ans=Array(qs.length).fill(null),flags=Array(qs.length).fill(false),start=Date.now();setInterval(()=>{let s=Math.floor((Date.now()-start)/1000);timer.textContent=`${String(Math.floor(s/3600)).padStart(2,'0')}:${String(Math.floor((s%3600)/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`},1000);const L=n=>String.fromCharCode(65+n);function draw(){count.textContent=`Question ${i+1} of ${qs.length} — ${qs[i].topic}`;q.textContent=qs[i].q;choices.innerHTML='';qs[i].choices.forEach((c,j)=>{let d=document.createElement('div');d.className='choice'+(ans[i]===j?' sel':'');d.innerHTML=`<b>${L(j)}.</b> ${c}`;d.onclick=()=>{ans[i]=j;draw()};choices.appendChild(d)});prev.disabled=i===0;next.textContent=i===qs.length-1?'Review':'Next';flag.textContent=flags[i]?'Unflag':'Flag';drawNav()}function drawNav(){nav.innerHTML='';qs.forEach((_,j)=>{let b=document.createElement('button');b.textContent=j+1;if(ans[j]!=null)b.classList.add('answered');if(j===i)b.classList.add('current');if(flags[j])b.classList.add('flagged');b.onclick=()=>{i=j;draw()};nav.appendChild(b)});let d=ans.filter(x=>x!=null).length;progress.textContent=`${d} answered, ${qs.length-d} unanswered`}prev.onclick=()=>{if(i>0){i--;draw()}};next.onclick=()=>{if(i<qs.length-1){i++;draw()}};flag.onclick=()=>{flags[i]=!flags[i];draw()};submit.onclick=()=>{let u=ans.filter(x=>x==null).length;if(u&&!confirm(`Submit with ${u} unanswered?`))return;if(confirm('Submit exam?'))grade()};function grade(){exam.classList.add('hidden');results.classList.remove('hidden');let c=qs.reduce((n,x,j)=>n+(ans[j]===x.answer),0);score.textContent=`${c} / ${qs.length} (${Math.round(c/qs.length*100)}%)`;let topics={};qs.forEach((x,j)=>{topics[x.topic]??={r:0,t:0};topics[x.topic].t++;if(ans[j]===x.answer)topics[x.topic].r++});breakdown.innerHTML='<h3>Topic breakdown</h3>'+Object.entries(topics).map(([k,v])=>`<div>${k}: <b>${v.r}/${v.t}</b></div>`).join('');review.innerHTML='';qs.forEach((x,j)=>{let d=document.createElement('div');d.className='card review '+(ans[j]===x.answer?'correct':'incorrect');d.innerHTML=`<b>Question ${j+1}</b><p>${x.q}</p><p>Your answer: ${ans[j]==null?'None':L(ans[j])}<br>Correct answer: ${L(x.answer)}</p><p><b>Explanation:</b> ${x.explanation}</p>`;review.appendChild(d)});scrollTo(0,0)}draw();</script></body></html>
